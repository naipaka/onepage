name: Flutter app code check

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Filter by paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            flutter:
              - '**/android/**'
              - '**/assets/**'
              - '**/dart_defines/**'
              - '**/golden_test/**'
              - '**/ios/**'
              - '**/lib/**'
              - '**/test/**'
              - '**/web/**'
              - '**/analysis_options.yaml'
              - '**/melos.yaml'
              - '**/pubspec.yaml'
              - '.fvmrc'

  analyze:
    needs: check
    if: needs.check.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter with FVM
        id: setup-flutter
        uses: kuhnroyal/flutter-fvm-config-action/setup@v3

      - name: Prepare Melos
        run: echo "MELOS_SDK_PATH=${{ env.FLUTTER_ROOT }}" >> "$GITHUB_ENV"

      - name: Install Melos
        uses: bluefireteam/melos-action@v3
        with:
          run-bootstrap: false

      - name: Install Dependencies
        run: dart pub get --enforce-lockfile

      - name: Analyze packages
        run: flutter analyze

      - name: Check for the existence of unformatted files
        # Cannot use `melos format` as it requires excluding files generated from the target file
        run: melos run format:ci --no-select

  test:
    needs: check
    if: needs.check.outputs.flutter == 'true'
    name: test (${{ matrix.name }}, ${{ matrix.rep }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
        name: [ubuntu-vg-c1, ubuntu-vg-c2, ubuntu-ft-c1, ubuntu-ft-c4, macos-app-vg]
        include:
          - { name: ubuntu-vg-c1, os: ubuntu-latest, warm: false, run: "melos exec -c 1 --fail-fast --flutter --dir-exists=test --ignore=onepage --ignore=device_photos -- very_good test --coverage" }
          - { name: ubuntu-vg-c2, os: ubuntu-latest, warm: true, run: "melos exec -c 2 --fail-fast --flutter --dir-exists=test --ignore=onepage --ignore=device_photos -- very_good test --coverage" }
          - { name: ubuntu-ft-c1, os: ubuntu-latest, warm: false, run: "melos exec -c 1 --fail-fast --flutter --dir-exists=test --ignore=onepage --ignore=device_photos -- flutter test --coverage" }
          - { name: ubuntu-ft-c4, os: ubuntu-latest, warm: false, run: "melos exec -c 4 --fail-fast --flutter --dir-exists=test --ignore=onepage --ignore=device_photos -- flutter test --coverage" }
          - { name: macos-app-vg, os: macos-latest, warm: false, run: "melos exec --scope=onepage --scope=device_photos -- very_good test --coverage" }
          - { name: macos-app-ft, os: macos-latest, warm: false, run: "melos exec --scope=onepage -- flutter test --coverage" }
          - { name: macos-all-ft-c3, os: macos-latest, warm: false, run: "melos exec -c 3 --fail-fast --flutter --dir-exists=test -- flutter test --coverage" }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter with FVM
        id: setup-flutter
        uses: kuhnroyal/flutter-fvm-config-action/setup@v3

      - name: Prepare Melos
        run: echo "MELOS_SDK_PATH=${{ env.FLUTTER_ROOT }}" >> "$GITHUB_ENV"

      - name: Install Melos
        uses: bluefireteam/melos-action@v3
        with:
          run-bootstrap: false

      - name: Install Dependencies
        run: dart pub get --enforce-lockfile

      - name: Install Very Good CLI
        run: dart pub global activate very_good_cli

      - name: Warm up very_good test
        if: matrix.warm
        run: very_good test

      - name: Run package tests
        run: ${{ matrix.run }}

  android-test:
    needs: check
    if: needs.check.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter with FVM
        id: setup-flutter
        uses: kuhnroyal/flutter-fvm-config-action/setup@v3

      - name: Prepare Melos
        run: echo "MELOS_SDK_PATH=${{ env.FLUTTER_ROOT }}" >> "$GITHUB_ENV"

      - name: Install Melos
        uses: bluefireteam/melos-action@v3
        with:
          run-bootstrap: false

      - name: Install Dependencies
        run: dart pub get --enforce-lockfile

      - name: Run Android unit tests
        run: melos run test:android --no-select
