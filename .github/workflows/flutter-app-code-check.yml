name: Flutter app code check

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Filter by paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            flutter:
              - '.github/actions/**'
              - '.github/workflows/flutter-app-code-check.yml'
              - '**/android/**'
              - '**/assets/**'
              - '**/dart_defines/**'
              - '**/golden_test/**'
              - '**/ios/**'
              - '**/lib/**'
              - '**/test/**'
              - '**/web/**'
              - '**/analysis_options.yaml'
              - '**/melos.yaml'
              - '**/pubspec.yaml'
              - '.fvmrc'

  analyze:
    needs: check
    if: needs.check.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Decode Firebase options
        env:
          FIREBASE_OPTIONS_DEV_BASE64: ${{ secrets.FIREBASE_OPTIONS_DEV_BASE64 }}
          FIREBASE_OPTIONS_PROD_BASE64: ${{ secrets.FIREBASE_OPTIONS_PROD_BASE64 }}
        run: |
          echo "$FIREBASE_OPTIONS_DEV_BASE64" | base64 -d > packages/app/lib/environment/src/firebase_options_dev.dart
          echo "$FIREBASE_OPTIONS_PROD_BASE64" | base64 -d > packages/app/lib/environment/src/firebase_options_prod.dart

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Analyze packages
        run: flutter analyze

      - name: Check for the existence of unformatted files
        # Cannot use `melos format` as it requires excluding files generated from the target file
        run: melos run format:ci --no-select

  test:
    needs: check
    if: needs.check.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install Very Good CLI
        run: dart pub global activate very_good_cli

      - name: Run package tests
        run: melos run test:ci --no-select

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info

  test-macos:
    needs: check
    if: needs.check.outputs.flutter == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install Very Good CLI
        run: dart pub global activate very_good_cli

      - name: Run package tests
        run: melos run test:ci:macos --no-select

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info

  android-test:
    needs: check
    if: needs.check.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Run Android unit tests
        run: melos run test:android --no-select
