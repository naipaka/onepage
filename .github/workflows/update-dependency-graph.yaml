name: Update Dependency Graph

permissions:
  contents: read

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  BRANCH_NAME: update-dependency-graph
  DOT_FILE: docs/dependency_graph.dot
  SVG_FILE: docs/dependency_graph.svg

jobs:
  update:
    name: Update Dependency Graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Generate Dependency Graph
        # Workaround: Update `pubspec.lock` timestamp to prevent "Resolving dependencies..."
        # from being output on every melos command execution.
        #
        # When git clones/checkouts, `pubspec.yaml` and `pubspec.lock` get the same timestamp,
        # causing dart pub to always run dependency resolution since it compares file timestamps.
        #
        # See:
        # - https://github.com/dart-lang/pub/issues/3558
        # - https://github.com/dart-lang/pub/issues/4672
        # - https://github.com/dart-lang/pub/issues/4699
        # - https://github.com/Dart-Code/Dart-Code/pull/5760
        run: |
          touch pubspec.lock
          melos list --gviz > "$DOT_FILE"

      - name: Generate GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PR_WRITER_CLIENT_ID }}
          private-key: ${{ secrets.PR_WRITER_PRIVATE_KEY }}

      - name: Decide whether to create a pull request
        id: decide
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          if [ -z "$(git status --porcelain -- "$DOT_FILE")" ]; then
            echo "::notice::The dependency graph has not changed."
            echo "create=false" >> "$GITHUB_OUTPUT"
          elif [ "$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq length)" -ne 0 ]; then
            echo "::notice::An open pull request from $BRANCH_NAME already exists."
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete the branch left without an open pull request
        if: steps.decide.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" > /dev/null; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH_NAME"
          fi

      - name: Install Graphviz
        if: steps.decide.outputs.create == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Generate SVG Image
        if: steps.decide.outputs.create == 'true'
        run: dot -Tsvg "$DOT_FILE" -o "$SVG_FILE"

      - name: Setup ghcp
        if: steps.decide.outputs.create == 'true'
        uses: ./.github/actions/setup-ghcp

      - name: Commit Changes
        if: steps.decide.outputs.create == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          ghcp commit \
            -r "$GITHUB_REPOSITORY" \
            -b "$BRANCH_NAME" \
            --parent "$GITHUB_REF_NAME" \
            -m "Update Dependency Graph and SVG image" \
            "$DOT_FILE" "$SVG_FILE"

      - name: Create Pull Request
        if: steps.decide.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          TITLE: "doc: Update Dependency Graph"
          BODY: "This PR updates the dependency graph and SVG image."
        run: gh pr create -B "$GITHUB_REF_NAME" -H "$BRANCH_NAME" -t "$TITLE" -b "$BODY" -a "$GITHUB_ACTOR"
