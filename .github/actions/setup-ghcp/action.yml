name: Setup ghcp
description: Installs ghcp, which commits files and creates pull requests through the GitHub API, and checks the download against its checksum.

runs:
  using: composite
  steps:
    - name: Install ghcp
      shell: bash
      env:
        VERSION: v1.15.3
        SHA256: 537b71c1382fc95c73702d4ba0fc1a2465842a1c20f9987d75b5c7581ba115ea
      run: |
        dir="$RUNNER_TEMP/ghcp"
        mkdir -p "$dir"
        curl -fsSL -o "$dir/ghcp.zip" "https://github.com/int128/ghcp/releases/download/$VERSION/ghcp_linux_amd64.zip"
        echo "$SHA256  $dir/ghcp.zip" | sha256sum --check --strict
        unzip -q "$dir/ghcp.zip" ghcp -d "$dir"
        echo "$dir" >> "$GITHUB_PATH"
