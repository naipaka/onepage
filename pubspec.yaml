name: onepage_workspace

environment:
  sdk: ^3.14.0

workspace:
  - packages/app
  - packages/core/configurator
  - packages/core/db_client
  - packages/core/device_photos
  - packages/core/i18n
  - packages/core/native_image_compressor
  - packages/core/native_image_compressor/example
  - packages/core/notification_client
  - packages/core/photo_client
  - packages/core/photo_storage
  - packages/core/prefs_client
  - packages/core/provider_utils
  - packages/core/theme
  - packages/core/tracker
  - packages/core/utils
  - packages/core/widgets
  - packages/features/backup
  - packages/features/diary
  - packages/features/exporter
  - packages/features/haptics
  - packages/features/in_app_reviewer
  - packages/features/photo_recovery
  - packages/features/scroll_calendar
  - packages/features/update_requester

dev_dependencies:
  melos: ^8.10.1

melos:
  repository: https://github.com/naipaka/onepage
  sdkPath: .fvm/flutter_sdk

  packages:
    - "packages/*"
    - "packages/core/*"
    - "packages/features/*"

  command:
    clean:
      hooks:
        post: |
          melos exec --flutter -- "flutter clean"
    version:
      branch: main
      releaseUrl: true

  scripts:
    # format:ci, gen, and gen:watch run once from the workspace root. They are
    # melos scripts so that they run with the Flutter SDK in sdkPath, which
    # MELOS_SDK_PATH replaces on CI.
    format:ci:
      # `dart format` cannot exclude files (dart_style issue 864), so `find`
      # lists the files without the generated ones. `-exec ... {} +` passes the
      # matches to as few `dart format` calls as possible and fails when one of
      # them does. Shell variables are avoided: melos interpolates `$name` in
      # scripts before the shell sees them.
      run: |
        find packages -name "*.dart" -not \( -name "*.freezed.dart" -o -name "*.g.dart" -o -name "*.gen.dart" -o -name "test_bundle.dart" -o -path "*/generated/*" -o -path "*/.dart_tool/*" -o -path "*/build/*" \) -exec dart format --output=none --set-exit-if-changed {} +
      description: Check formatting without writing.

    gen:
      run: dart run build_runner build --workspace
      description: Run generate code.

    gen:watch:
      run: dart run build_runner watch --workspace
      description: Watch and run generate code.

    fix:
      exec: |
        dart fix --apply lib
      description: Run dart fix.
      packageFilters:
        dirExists: lib

    slang:
      exec:
        command: dart run slang
        concurrency: 1
      description: Run generate translation code.
      packageFilters:
        dirExists: lib
        dependsOn: slang

    slang:watch:
      exec:
        command: dart run slang watch
        concurrency: 1
      description: Run generate translation code.
      packageFilters:
        dirExists: lib
        dependsOn: slang

    drift:migrations:
      exec:
        command: dart run drift_dev make-migrations
        concurrency: 1
      description: Run drift migration.
      packageFilters:
        dirExists: lib
        dependsOn: "drift_dev"

    test:
      exec:
        command: flutter test
        failFast: true
      description: Run flutter test.
      packageFilters:
        dirExists: test

    test:cov:
      exec:
        command: |
          flutter test --coverage
          lcov --remove coverage/lcov.info 'lib/**.g.dart' -o coverage/new_lcov.info --ignore-errors unused
          genhtml coverage/new_lcov.info -o coverage/html
          open coverage/html/index.html
        failFast: true
      description: Run flutter test with coverage.
      packageFilters:
        dirExists: test

    # `very_good test` fails when several packages compile its test optimizer
    # at once (very_good_cli issue 947), so the CI scripts run one package at a
    # time.
    test:ci:
      exec:
        command: very_good test --coverage
        concurrency: 1
        failFast: true
      description: Run the tests of the packages that run on any OS for CI.
      packageFilters:
        flutter: true
        dirExists: test
        ignore:
          - device_photos
          - onepage

    test:ci:macos:
      exec:
        command: very_good test --coverage
        concurrency: 1
        failFast: true
      description: Run the tests that need macOS for CI (golden tests and photo_manager).
      packageFilters:
        scope:
          - device_photos
          - onepage

    test:android:
      # Every plugin compiles Flutter's Gradle plugin into the same Kotlin
      # caches in the Flutter SDK, which fail when two builds open them at once.
      exec:
        # `\$` keeps the calling shell from expanding the name before melos sets
        # it for each package.
        command: >-
          cd example &&
          flutter build apk --debug --config-only &&
          cd android &&
          ./gradlew :\$MELOS_PACKAGE_NAME:testDebugUnitTest
        concurrency: 1
      description: Run the Android unit tests of each plugin.
      packageFilters:
        dirExists: example/android

    golden:
      exec: flutter test --tags=golden
      description: Run golden tests to verify UI has not changed.
      packageFilters:
        dirExists: test/golden

    golden:update:
      exec: flutter test --tags=golden --update-goldens
      description: Update golden test images when UI has changed.
      packageFilters:
        dirExists: test/golden

    flutterfire:update:
      exec: flutterfire update
      description: Run flutterfire update.
      packageFilters:
        flutter: true
        dirExists: lib
        dependsOn: "firebase_core"

    build:android:prod:
      exec:
        command: |
          flutter build appbundle --dart-define-from-file=dart_defines/prod.env && \
          sh create_native_debug_symbol.sh
        concurrency: 1
      description: Build the AppBundle for the production app.
      packageFilters:
        scope: onepage

    upload:ios:prod:
      # `flutter build ipa` reads build/ios/ipa after the export to report the
      # IPA size, but an export that uploads to App Store Connect does not
      # create the directory, so the command fails after a successful upload
      # (Flutter issue 148277). Remove the mkdir once Flutter handles it.
      # `flutter build ipa` also exits with success when the upload fails and
      # only prints "Encountered error while creating the IPA", so the script
      # fails when the output has that line.
      exec:
        command: |
          set -o pipefail && \
          mkdir -p build/ios/ipa && \
          flutter build ipa --dart-define-from-file=dart_defines/prod.env --export-options-plist="ios/prod/UploadOptions.plist" 2>&1 | tee build/ios/upload.log && \
          ! grep -q "Encountered error while creating the IPA" build/ios/upload.log
        concurrency: 1
      description: Upload the IPA for the production app.
      packageFilters:
        scope: onepage
