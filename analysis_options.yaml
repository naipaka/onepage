# Shared analysis options for the workspace. Every package includes this file
# by relative path, so repo-wide overrides live here.
include: package:altive_lints/altive_lints_preset.yaml

analyzer:
  exclude:
    - "build/**"
    - "**/build/**"

# Analyzer plugins are honoured only in the workspace root's options file.
plugins:
  riverpod_lint: ^3.2.0

linter:
  rules:
    # Same conflict the preset already resolves for `unnecessary_async`: on
    # `() async => someFuture()` this rule and `unnecessary_await_in_return`
    # contradict each other, and the only shape both accept is dropping
    # `async`, which then trips `discarded_futures` at call sites. Keep the
    # `async` wrappers and turn this rule off instead.
    async_return_with_no_await: false
