name: db_client
description: A new Flutter package project.
version: 1.0.0
publish_to: "none"

environment:
  sdk: ^3.13.2

resolution: workspace

dependencies:
  clock: ^1.1.2
  # Held at 2.34.0: 2.34.1 reworked the drift3_preview `GeneratedDatabase` API
  # (`allSchemaEntities` -> `schema`), which breaks the schema verifier in
  # drift_dev 2.34.0, so drift and drift_dev have to move together.
  #
  # The analyzer 13 ceiling that also blocked this is gone as of Flutter 3.47.2
  # (flutter_test now allows meta ^1.18.3 and test_api 0.7.12), so the only
  # remaining work is migrating the schema verifier to the new API. Unpinning is
  # left to the next dependabot run.
  drift: 2.34.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.3.3

dev_dependencies:
  # Temporarily disabled: analyzer constraint conflicts with the riverpod stack (analyzer 12).
  # Replaced by an in-repo lint package. See https://github.com/naipaka/onepage/issues/249
  # altive_lints: ^2.3.0
  build_runner: ^2.16.1
  # Held at 2.34.0: later releases require analyzer 13, which the Flutter SDK
  # blocks (see the drift note above).
  drift_dev: 2.34.5
  flutter_test:
    sdk: flutter
  mockito: ^5.8.1
