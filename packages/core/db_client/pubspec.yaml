name: db_client
description: A new Flutter package project.
version: 1.0.0
publish_to: "none"

environment:
  sdk: ^3.13.2

resolution: workspace

dependencies:
  clock: ^1.1.2
  # Held at 2.34.0: 2.34.1 reworked the drift3_preview `GeneratedDatabase` API
  # (`allSchemaEntities` -> `schema`). drift_dev has since moved on to 2.34.5
  # and its schema verifier still passes against 2.34.0, so only drift itself
  # is held until the schema verifier is migrated to the new API.
  drift: 2.34.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.3.3

dev_dependencies:
  # Temporarily disabled: analyzer constraint conflicts with the riverpod stack (analyzer 12).
  # Replaced by an in-repo lint package. See https://github.com/naipaka/onepage/issues/249
  # altive_lints: ^2.3.0
  build_runner: ^2.16.1
  drift_dev: 2.34.5
  flutter_test:
    sdk: flutter
  mockito: ^5.8.1
