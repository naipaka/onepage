name: photo_recovery
description: A package that copies photos saved on the device into app storage.
version: 1.0.0
publish_to: "none"

environment:
  sdk: ^3.14.0

resolution: workspace

dependencies:
  db_client:
    path: ../../core/db_client/
  device_photos:
    path: ../../core/device_photos/
  flutter:
    sdk: flutter
  photo_storage:
    path: ../../core/photo_storage/

dev_dependencies:
  altive_lints: ^4.1.0
  build_runner: ^2.16.1
  clock: ^1.1.3
  flutter_test:
    sdk: flutter
  mockito: ^5.8.1
  path: ^1.9.1
