version: 1.0.0
publish_to: "none"

environment:
  sdk: ^3.14.0

resolution: workspace

dependencies:
  db_client:
    path: ../../core/db_client/
  device_photos:
    path: ../../core/device_photos/
  flutter:
    sdk: flutter
