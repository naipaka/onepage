include: package:altive_lints/altive_lints.yaml
analyzer:
  exclude:
    - "**/l10n/*.dart"
    - "**/gen/*.dart"
    - "**/firebase_options_*.dart"
    - "**/*.mocks.dart"
    - "patrol_test/test_bundle.dart"
    # altive_lints_plugin 1.0.0 does not honour `ignore_for_file` for its own
    # diagnostics, so the `avoid_hardcoded_japanese` ignore inside this stub provider
    # has no effect. Excluded until the plugin respects ignore comments.
    - "lib/pages/src/stub_diaries_state_provider.dart"
    - build/**
    - android/**
    - ios/**
linter:
  rules:
    discarded_futures: false # Disabled for golden tests
    avoid_classes_with_only_static_members: false # Disabled for test helpers
    eol_at_end_of_file: false # Disabled for test files
