name: onepage
description: About One-page-only diary app
publish_to: none
version: 1.11.0+19

environment:
  sdk: ^3.14.0

resolution: workspace

dependencies:
  adaptive_dialog: ^3.1.0
  app_settings: ^9.0.1
  backup:
    path: ../features/backup/
  clock: ^1.1.3
  collection: ^1.19.1
  configurator:
    path: ../core/configurator/
  cupertino_ui: ^1.1.6
  db_client:
    path: ../core/db_client/
  device_photos:
    path: ../core/device_photos/
  diary:
    path: ../features/diary/
  exporter:
    path: ../features/exporter/
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.4
  gap: ^3.1.0
  go_router: ^18.1.4
  haptics:
    path: ../features/haptics/
  hooks_riverpod: ^3.5.0
  i18n:
    path: ../core/i18n/
  in_app_reviewer:
    path: ../features/in_app_reviewer/
  # Because flutter depends on intl 0.20.2.
  # https://github.com/flutter/flutter/blob/stable/packages/flutter/pubspec.yaml#L42
  intl: ^0.20.3
  # FIXME: Remove once adaptive_dialog stops allowing macos_ui 2.0.0, which
  # uses IgnorePointer.ignoringSemantics, removed in Flutter 3.50.
  macos_ui: ^2.2.2
  material_ui: ^1.11.0
  notification_client:
    path: ../core/notification_client/
  photo_client:
    path: ../core/photo_client/
  photo_recovery:
    path: ../features/photo_recovery/
  photo_storage:
    path: ../core/photo_storage/
  prefs_client:
    path: ../core/prefs_client/
  provider_utils:
    path: ../core/provider_utils/
  riverpod_annotation: ^4.0.8
  scroll_calendar:
    path: ../features/scroll_calendar/
  share_plus: ^13.3.1
  theme:
    path: ../core/theme/
  tracker:
    path: ../core/tracker/
  update_requester:
    path: ../features/update_requester/
  url_launcher: ^6.3.3
  utils:
    path: ../core/utils/
  visibility_detector: ^0.4.0+2
  widgets:
    path: ../core/widgets/

dev_dependencies:
  altive_lints: ^4.2.0
  build_runner: ^2.16.2
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.3
  meta: ^1.19.0
  mockito: ^5.8.1
  package_info_plus: ^10.2.2
  patrol: ^4.11.0
  riverpod_generator: ^4.0.10

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/

patrol:
  app_name: One Page Dev
  android:
    package_name: com.naipaka.onepage.dev
  ios:
    bundle_id: com.naipaka.onepage.dev
